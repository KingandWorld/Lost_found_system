spring.application.name=springboot
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.enable-spring-security=false
spring.security.user.name=admin
# ⚠️ 安全：生产环境必须通过环境变量设置敏感凭据，禁止明文硬编码
#     以下默认值仅用于本地开发，上线前必须删除 ":xxx"
#     Linux/macOS: export DB_PASSWORD=xxx
#     Windows:      set DB_PASSWORD=xxx
spring.security.user.password=${SPRING_SECURITY_PASSWORD:admin}
springdoc.swagger-ui.tags-sorter=alpha

springdoc.swagger-ui.operations-sorter: alpha
springdoc.swagger-ui.enabled: true
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.paths-to-match= /**
springdoc.packages-to-scan:org.example.springboot

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/lost_found_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&sslMode=DISABLED
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-built-in-alias-types=true
# 文件上传存储路径（相对于工作目录，建议生产环境改为绝对路径如 D:/lost-found-files）
# 必须在 IDEA 运行配置中设置工作目录为 springboot/ 模块目录
file.base-path=./files
server.port=1235

# 新用户默认密码（开发环境可设置 USER_DEFAULT_PASSWORD 环境变量覆盖）
user.defaultPassword=${USER_DEFAULT_PASSWORD:123456}

# JWT 签名密钥 — 生产环境必须通过环境变量 JWT_SECRET 设置
# 生成示例: openssl rand -base64 48
# ⚠️ 下方默认值仅用于本地开发，上线前必须删除 ":dev-secret"
jwt.secret=${JWT_SECRET:dev-secret-do-not-use-in-production}

server.servlet.context-path=/
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/
mybatis-plus.mapper-locations=classpath:/mapper/*.xml
spring.jackson.default-property-inclusion=non_empty

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

knife4j.enable=true
knife4j.setting.language=zh_cn
knife4j.basic.enable=true
knife4j.basic.username=admin
knife4j.basic.password=${KNIFE4J_PASSWORD:admin}
