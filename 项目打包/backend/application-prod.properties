# ===================================================
# 生产环境配置 — application-prod.properties
# 部署到宝塔面板时，将此文件复制到 jar 包同级目录
# 或通过 --spring.config.location 指定路径
# ===================================================

spring.application.name=lost-found-system

# 服务器端口
server.port=1235

# ==================== 数据库配置 ====================
# ⚠️ 部署前必须修改：将下方占位符替换为实际数据库信息
# 宝塔面板 → 数据库 → 查看数据库详情获取连接信息
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/lost_found_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=lost_found_user
spring.datasource.password=YOUR_DB_PASSWORD_HERE

# ==================== MyBatis Plus ====================
mybatis.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath:/mapper/*.xml

# ==================== 文件上传 ====================
# 生产环境使用绝对路径，部署前创建此目录
# 宝塔面板中建议路径：/www/wwwroot/你的域名/files
file.base-path=/www/wwwroot/lost-found/files
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== Spring Security ====================
# ⚠️ 生产环境必须使用强密码，通过环境变量设置
spring.security.user.name=admin
spring.security.user.password=${SPRING_SECURITY_PASSWORD:Admin@123!}

# ==================== JWT ====================
# ⚠️ 生产环境必须使用强随机密钥（openssl rand -base64 48 生成）
jwt.secret=${JWT_SECRET:CHANGE_ME_GENERATE_RANDOM_48_CHAR_KEY}

# ==================== 新用户默认密码 ====================
user.defaultPassword=${USER_DEFAULT_PASSWORD:123456}

# ==================== Jackson ====================
spring.jackson.default-property-inclusion=non_empty

# ==================== Knife4j / Swagger ====================
# 生产环境建议关闭 API 文档
knife4j.enable=false
knife4j.setting.language=zh_cn
knife4j.basic.enable=true
knife4j.basic.username=admin
knife4j.basic.password=${KNIFE4J_PASSWORD:Admin@123!}

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ==================== 静态资源 ====================
server.servlet.context-path=/
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/
