# ===================================================
# 失物招领系统 — Nginx 配置
# 部署位置：宝塔面板 → 网站 → 设置 → 配置文件
# ===================================================

server {
    listen 80;
    server_name your-domain.com;  # ⚠️ 替换为你的域名或服务器IP
    root /www/wwwroot/lost-found/frontend/dist;  # ⚠️ 替换为实际前端文件路径
    index index.html;

    # 字符集
    charset utf-8;

    # ⚠️ 文件上传大小限制（默认1M，图片/头像很容易超过）
    client_max_body_size 20m;
    client_body_buffer_size 128k;

    # 访问日志
    access_log /www/wwwlogs/lost-found-access.log;
    error_log  /www/wwwlogs/lost-found-error.log;

    # ==================== 前端静态文件 ====================
    location / {
        try_files $uri $uri/ /index.html;
        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ==================== API 反向代理到后端 ====================
    location /api/ {
        proxy_pass http://127.0.0.1:1235/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ==================== 文件/图片直接由 Nginx 提供 ====================
    # ⚠️ 重要：前端会在图片路径前拼接 /api 前缀（baseAPI + imagePath），
    #         所以实际请求是 /api/img/xxx.jpg 而非 /img/xxx.jpg
    #         因此需要同时配置 /api/img/ 和 /img/ 两条规则
    # 后端上传的文件存储在 /www/wwwroot/lost-found/files
    #
    # 访问示例：
    #   /api/img/1754744271896.jpg → /www/wwwroot/lost-found/files/img/1754744271896.jpg
    #   /img/1754744271896.jpg     → /www/wwwroot/lost-found/files/img/1754744271896.jpg

    # ⚠️ 必须放在 location /api/ 前面，^~ 确保不被 /api/ 拦截
    location ^~ /api/img/ {
        alias /www/wwwroot/lost-found/files/img/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /api/file/ {
        alias /www/wwwroot/lost-found/files/file/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /img/ {
        alias /www/wwwroot/lost-found/files/img/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /file/ {
        alias /www/wwwroot/lost-found/files/file/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ==================== Gzip 压缩 ====================
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # ==================== 安全头 ====================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
